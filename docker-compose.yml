services:
  face-recognition-app:
    build: .
    container_name: student-attendance-system
    ports:
      - "5000:5000"
    volumes:
      # Persist dataset and attendance data
      - ./dataset:/app/dataset
      - ./attendance.csv:/app/attendance.csv
      - ./static:/app/static
      - ./templates:/app/templates
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Bangkok    
    restart: unless-stopped
    networks:
      - attendance-network
    # For camera access (if running locally)
    #devices:
     # - "/dev/video0:/dev/video0"
    # Optional: Add resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

networks:
  attendance-network:
    driver: bridge

